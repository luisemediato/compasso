name: CI do Compasso

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    name: Unidade, integração e navegador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório E2E por sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Enviar cobertura ao Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  deploy:
    name: Publicar e verificar produção
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: compasso-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Aplicar migrações no D1 remoto
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Preparar endereço gratuito workers.dev
        run: node scripts/workers-subdomain.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPASSO_WORKERS_SUBDOMAIN: compasso-ufmg-2026
      - name: Publicar o SHA aprovado
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          command: deploy
      - name: Verificar URL e revisão públicas
        run: npm run test:smoke -- "$COMPASSO_URL"
        env:
          COMPASSO_URL: ${{ steps.publish.outputs.deployment-url }}
          COMPASSO_REVISION: ${{ github.sha }}
      - name: Registrar endereço da aplicação
        env:
          COMPASSO_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          printf 'Aplicação: %s\n\nCommit: %s\n' "$COMPASSO_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
